name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    # Build on 22.04 so the downloadable GNU/Linux binary targets glibc 2.35+.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Verify source
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and exercise release binary
        run: |
          cargo build --release --locked
          python3 scripts/smoke.py target/release/astrarium
          bash scripts/package-release.sh
      - name: Publish archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/astrarium-*-unknown-linux-gnu.tar.gz dist/SHA256SUMS \
            --verify-tag --generate-notes --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --title "Astrarium $GITHUB_REF_NAME"
