name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Rust stable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Interactive terminal and language tests
        run: python3 scripts/smoke.py target/release/astrarium
      - name: Build downloadable archive
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: astrarium-linux-test-build
          path: |
            dist/astrarium-*-unknown-linux-gnu.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
