[package]
name = "astrarium"
version = "0.4.0"
edition = "2021"
description = "An offline, keyboard-and-mouse planetarium for your terminal"
license = "MIT"
authors = ["Santiago González"]
repository = "https://github.com/laflechaenelaire/astrarium"
homepage = "https://github.com/laflechaenelaire/astrarium"
readme = "README.md"
keywords = ["astronomy", "planetarium", "terminal", "tui", "offline"]
categories = ["command-line-utilities", "science"]
include = ["/src/**", "/data/**", "/assets/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md"]

[dependencies]
astronomy-engine-bindings = "2.1.19"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
